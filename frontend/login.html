<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Áurea Beauty</title>
<link rel="icon" href="/assets/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner" style="justify-content:center;">
    <a href="/index.html" class="logo-link"><img src="/assets/logo.jpg" alt="Áurea Beauty"></a>
  </div>
</header>

<main class="pagina-form">
  <div class="form-card">
    <span class="eyebrow" style="display:block;text-align:center;">Bem-vinda(o) de volta</span>
    <h1>Entrar</h1>
    <p class="subtitulo">Acesse sua conta para acompanhar pedidos e finalizar compras</p>

    <form id="formLogin" novalidate>
      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" required placeholder="seuemail@exemplo.com">
        <span class="campo-erro"></span>
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" required placeholder="••••••••">
        <span class="campo-erro"></span>
      </div>
      <button type="submit" class="btn btn-primario btn-full">Entrar</button>
    </form>

    <p class="form-rodape-link">Ainda não tem conta? <a href="/cadastro.html">Criar conta</a></p>
    <p class="form-rodape-link"><a href="/index.html"><i class="fa-solid fa-arrow-left"></i> Voltar à loja</a></p>
  </div>
</main>

<footer class="site-footer" style="padding-top:24px;">
  <div class="container footer-bottom" style="border-top:none;justify-content:center;">
    <span>© <span id="ano-atual"></span> Áurea Beauty. Todos os direitos reservados.</span>
  </div>
</footer>

<script src="/js/app.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
