<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Administrativo — Áurea Beauty</title>
<link rel="icon" href="/assets/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>

<div class="admin-login-tela">
  <div class="admin-login-card">
    <img src="../assets/logo.jpg" alt="Áurea Beauty">
    <h1>Painel Administrativo</h1>
    <p class="subtitulo">Acesso restrito a administradores da Áurea Beauty</p>

    <form id="formLoginAdmin" novalidate>
      <div class="campo">
        <label for="adminEmail">E-mail</label>
        <input type="email" id="adminEmail" required placeholder="admin@aureabeauty.com">
      </div>
      <div class="campo">
        <label for="adminSenha">Senha</label>
        <input type="password" id="adminSenha" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primario btn-full">Entrar no painel</button>
    </form>

    <p class="form-rodape-link" style="margin-top:20px;">
      <a href="/index.html"><i class="fa-solid fa-arrow-left"></i> Voltar à loja</a>
    </p>
  </div>
</div>

<script src="../js/app.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
